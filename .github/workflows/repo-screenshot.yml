name: Repository screenshot

# Takes a screenshot of the repository page for the Milestone 2 report (Section 5).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/repo-screenshot-trigger"]

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Screenshot the repository page
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 1280, "height": 1300})
              pg.goto("https://github.com/${{ github.repository }}", wait_until="networkidle")
              pg.screenshot(path="docs/screenshots/repository.png")
              b.close()
          PY
      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/repository.png
          git commit -m "Add repository screenshot" || echo "nothing to commit"
          git pull --rebase && git push
